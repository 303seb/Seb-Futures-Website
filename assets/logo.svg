<!--
  The Market Element — brand mark.
  Three hollow ascending bars standing on two parallel rails, rebuilt as
  vector so it stays sharp at any size. Transparent background: it sits on
  the white nav bubble. Purple is the site accent family so the mark and the
  UI agree. Simplified small-size variant lives in favicon.svg.

  Geometry: bar pitch 14, bottoms sitting 3 units proud of the upper rail,
  which climbs at the same 0.464 slope — so the bars step up in parallel.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="The Market Element">
  <defs>
    <linearGradient id="tmeBar" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#8b7ccd"/>
      <stop offset="1" stop-color="#5d4fa4"/>
    </linearGradient>
  </defs>

  <!-- Rails, drawn first so the bars overlap them -->
  <g stroke="#1b1b22" stroke-width="3.3" stroke-linecap="round">
    <path d="M6 55.4 58 31.3"/>
    <path d="M6 49.4 58 25.3"/>
  </g>
  <g stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.7">
    <path d="M6.9 53.7 56.1 30.9"/>
    <path d="M6.9 47.7 56.1 24.9"/>
  </g>

  <!-- Hollow bars: outer rectangle with an inner slot punched through -->
  <g fill="url(#tmeBar)" stroke="#1b1b22" stroke-width="1.5" stroke-linejoin="round" fill-rule="evenodd">
    <path d="M12 19.5h9v28h-9V19.5Zm2.9 3v22h3.2v-22h-3.2Z"/>
    <path d="M26 13h9v28h-9V13Zm2.9 3v22h3.2v-22h-3.2Z"/>
    <path d="M40 6.5h9v28h-9V6.5Zm2.9 3v22h3.2v-22h-3.2Z"/>
  </g>
  <!-- Bevel highlight on the top face of each bar -->
  <g stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.75">
    <path d="M13.1 20.6h6.8"/>
    <path d="M27.1 14.1h6.8"/>
    <path d="M41.1 7.6h6.8"/>
  </g>
</svg>
