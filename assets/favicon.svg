<!--
  Favicon — deliberately simplified from logo.svg for 16-32px rendering:
  the bars are solid (the slot closes to mud at tab size), walls are a touch
  wider and the rails heavier. The light plate matters: the rails are
  near-black, so on a transparent background they would disappear against a
  dark browser tab.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="13" fill="#f4f3f8"/>
  <g transform="translate(4.5 4.5) scale(0.86)">
    <g stroke="#1b1b22" stroke-width="4.6" stroke-linecap="round">
      <path d="M6 55.4 58 31.3"/>
      <path d="M6 49.4 58 25.3"/>
    </g>
    <g fill="#7365b6" stroke="#1b1b22" stroke-width="2" stroke-linejoin="round">
      <rect x="12" y="19.5" width="10" height="28" rx="1"/>
      <rect x="26" y="13"   width="10" height="28" rx="1"/>
      <rect x="40" y="6.5"  width="10" height="28" rx="1"/>
    </g>
  </g>
</svg>
