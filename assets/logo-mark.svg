<!--
  Small-size variant of logo.svg, transparent background, used for the ~30px
  nav mark. The bars are solid here: at that size the hollow slot in the full
  logo is barely a pixel wide, so the dark outline swallows it and the mark
  reads black instead of purple. Same geometry, fewer details.
  Use logo.svg anywhere it renders larger than about 64px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="The Market Element">
  <defs>
    <linearGradient id="tmeMark" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#8b7ccd"/>
      <stop offset="1" stop-color="#5f51a6"/>
    </linearGradient>
  </defs>

  <g stroke="#1b1b22" stroke-width="4.2" stroke-linecap="round">
    <path d="M6 55.4 58 31.3"/>
    <path d="M6 49.4 58 25.3"/>
  </g>

  <g fill="url(#tmeMark)" stroke="#1b1b22" stroke-width="1.8" stroke-linejoin="round">
    <rect x="12" y="19.5" width="10" height="28" rx="1"/>
    <rect x="26" y="13"   width="10" height="28" rx="1"/>
    <rect x="40" y="6.5"  width="10" height="28" rx="1"/>
  </g>
</svg>
